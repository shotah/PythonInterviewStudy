[tool.flake8]
max-line-length = 110
ignore = ["E111", "W503"]
exclude = [".aws-sam", "__pycache__", "env", ".env", "*.md", "*.toml", "*.yaml", "*.json", "Pipfile*", "LICENSE", "makefile", ".*"]
max-complexity = 10
max-cognitive-complexity = 10
max-adjustable-complexity = 7

[tool.autopep8]
max_line_length = 110
in-place = true
recursive = true
aggressive = 3

[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "--cov=. --cov-branch --cov-report term-missing --cov-fail-under=80 --color=yes"

[tool.coverage.run]
omit = ["tests/*", "*__init__*", "scrap*"]
